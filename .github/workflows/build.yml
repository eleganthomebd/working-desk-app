name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (everything logged to build.log)
        run: |
          set -o pipefail
          {
            set -ex
            export JAVA_HOME="$JAVA_HOME_17_X64"
            echo "ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME"
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
            curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/g.zip -d /tmp
            export KS_PASS=$(openssl rand -hex 16) KS_PATH="$RUNNER_TEMP/release.jks"
            keytool -genkeypair -keystore "$KS_PATH" -storepass "$KS_PASS" -keypass "$KS_PASS" -alias workingdesk -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Elegant Home BD, O=Elegant Home BD, C=BD"
            /tmp/gradle-8.9/bin/gradle :app:assembleRelease --no-daemon --stacktrace
          } > build.log 2>&1
      - name: Publish result to apk branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk /tmp/out/WorkingDesk.apk 2>/dev/null || true
          echo "${{ job.status }} $(date -u)" > /tmp/out/STATUS.txt
          cd /tmp/out
          git init -q -b apk
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
